# Fuller tool descriptions: what each tool does and what the model sees next. Select with tools=detailed
# (only used with experiment.action_format=tools). Everything not set here comes from tools/default.yaml.
# The terse defaults ("Stop exploring.") leave the model to guess what a tool does, and the 11 Oct 2026
# stopping sweep showed that small wording changes move stop rates a lot, so keep the wording a variable.
defaults:
  - default
  - _self_

definitions:
  follow_link:
    description: >-
      Open a page. Give a title exactly as it appears under "Candidate links" on the current page, or in the
      search results you were just shown. You will then see that page's full text and its own list of links.
    parameters:
      properties:
        title:
          description: The page title, copied exactly as it is listed.
        reasoning:
          description: Why you are choosing this page, in 1-3 sentences.
  search:
    description: >-
      Search the titles of English Wikipedia articles. You get a short list of matching articles, each with a
      one-line snippet, and then choose one of them to open. Searching does not open a page by itself.
    parameters:
      properties:
        query:
          description: Your search terms, matched against article titles.
  stop:
    description: >-
      End the session. No further pages are shown after this, and the session cannot be resumed.
    parameters:
      properties:
        reason:
          description: Why you are ending the session, in 1-3 sentences.
