[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gap-attractor"
version = "0.1.0"
description = "Reproducible Wikipedia traversal harness for Gap Attractor experiments"
requires-python = ">=3.10"
dependencies = ["hydra-core>=1.3,<1.4", "requests>=2.31"]

[project.optional-dependencies]
dump = ["pandas>=2.0"]
analysis = ["numpy>=1.26", "pandas>=2.0", "pyyaml>=6.0"]
graph = ["numpy>=1.26", "scipy>=1.11"]   # scripts/graph/ (modularity.py also needs python-igraph)
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
gap-attractor = "gap_attractor.cli:main"
gap-attractor-analyze = "gap_attractor.analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gap_attractor"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/context_file/tests"]
pythonpath = ["src"]
